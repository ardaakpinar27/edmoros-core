<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Edmor Game Launcher</title>
    <style>
        /* Önceki stil kodların aynen kalsın (Mor header, bubble vb.) */
        :root { --header-purple: #6b46c1; --bg: #f4f5f7; }
        body { background: var(--bg); font-family: sans-serif; margin: 0; padding-top: 65px; }
        header { background: var(--header-purple); height: 65px; position: fixed; top: 0; width: 100%; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .logo { color: white; font-weight: 800; letter-spacing: 2px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; }
        .game-card { background: white; border-radius: 20px; height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .game-title { font-size: 12px; font-weight: bold; margin-top: 10px; word-break: break-all; }
        .platform-badge { font-size: 10px; color: var(--header-purple); font-weight: bold; }
    </style>
</head>
<body onload="loadGames()">
    <header><div class="logo">EDMOR GAME LAUNCHER</div></header>
    <main><div class="game-grid" id="container"><!-- Oyunlar buraya dolacak --></div></main>

    <script>
        function loadGames() {
            if (window.AndroidBridge) {
                // Java'dan JSON listesini çek
                const jsonString = window.AndroidBridge.getGamesJson();
                const games = JSON.parse(jsonString);
                const container = document.getElementById('container');
                container.innerHTML = '';

                if (games.length === 0) {
                    container.innerHTML = '<p style="text-align:center; width:100%;">Oyun bulunamadı. Lütfen ROM'ları PSP veya Download klasörüne atın.</p>';
                    return;
                }

                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.onclick = () => window.AndroidBridge.launchEmulator(game.platform, game.path);
                    card.innerHTML = `
                        <div class="platform-badge">${game.platform}</div>
                        <div class="game-title">${game.title}</div>
                    `;
                    container.appendChild(card);
                });
            }
        }
    </script>
</body>
</html>

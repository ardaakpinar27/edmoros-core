<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Edmor Game Launcher</title>
    <style>
        :root {
            --bg-main: #f4f5f7;
            --header-purple: #6b46c1;
            --bg-card: #ffffff;
            --text-dark: #1a202c;
            --text-white: #ffffff;
            --border: #e2e8f0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-dark);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 0;
            overflow-x: hidden;
            padding-top: 65px; /* Header boşluğu */
        }

        /* --- HEADER --- */
        header {
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--header-purple);
            position: fixed;
            top: 0; width: 100%; z-index: 1000;
            box-sizing: border-box;
        }

        .logo-center {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--text-white);
            text-transform: uppercase;
            margin: 0;
        }

        /* --- OYUN GRİDİ --- */
        main { padding: 20px; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .game-card {
            background-color: var(--bg-card);
            border-radius: 25px;
            border: 1px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-height: 180px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: transform 0.2s, opacity 0.3s;
            cursor: pointer;
        }

        .game-card:active { transform: scale(0.95); }

        .platform-badge {
            font-size: 10px;
            font-weight: 900;
            color: var(--header-purple);
            background: #f0edf7;
            padding: 4px 10px;
            border-radius: 50px;
            margin-bottom: 10px;
        }

        .game-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-dark);
            word-break: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-top: 10px;
        }
        .online { background: #48bb78; }
        .offline { background: #f56565; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #718096;
        }
    </style>
</head>
<body onload="scanGames()">

    <header>
        <h1 class="logo-center">EDMOR GAME LAUNCHER</h1>
    </header>

    <main>
        <div class="game-grid" id="game-container">
            <div class="empty-state">Oyunlar taranıyor...</div>
        </div>
    </main>

    <script>
        function scanGames() {
            if (window.AndroidBridge) {
                try {
                    const jsonString = window.AndroidBridge.getGamesJson();
                    const games = JSON.parse(jsonString);
                    renderGames(games);
                } catch (e) {
                    document.getElementById('game-container').innerHTML = 
                        '<div class="empty-state">Hata: Oyun listesi okunamadı.</div>';
                }
            } else {
                document.getElementById('game-container').innerHTML = 
                    '<div class="empty-state">Sistem köprüsü bulunamadı. Lütfen uygulamayı Android cihazda açın.</div>';
            }
        }

        function renderGames(games) {
            const container = document.getElementById('game-container');
            container.innerHTML = '';

            if (games.length === 0) {
                container.innerHTML = '<div class="empty-state">Hiç oyun bulunamadı.<br><small>ROM dosyalarını Download veya PSP klasörüne attığınızdan emin olun.</small></div>';
                return;
            }

            games.forEach(game => {
                // Emülatörün yüklü olup olmadığını Java'dan sor
                const isInstalled = window.AndroidBridge.isPackageInstalled(game.package);
                
                const card = document.createElement('div');
                card.className = 'game-card';
                if (!isInstalled) card.style.opacity = "0.6";

                card.onclick = () => {
                    if (isInstalled) {
                        window.AndroidBridge.launchEmulator(game.package, game.path);
                    } else {
                        alert("Hata: " + game.platform + " emülatörü (" + game.package + ") yüklü değil!");
                    }
                };

                card.innerHTML = `
                    <div class="platform-badge">${game.platform}</div>
                    <div class="game-title">${game.title}</div>
                    <div class="status-dot ${isInstalled ? 'online' : 'offline'}"></div>
                `;
                
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Edmor Game Launcher</title>
    <style>
        :root { --purple: #6b46c1; --bg: #f4f5f7; }
        body { background: var(--bg); font-family: sans-serif; margin: 0; padding-top: 130px; }
        
        header { 
            background: var(--purple); height: 60px; position: fixed; 
            top: 0; width: 100%; display: flex; align-items: center; 
            justify-content: center; z-index: 1001; 
        }

        /* --- BUBBLE KATEGORİLERİ --- */
        .bubble-container {
            position: fixed; top: 60px; width: 100%; height: 60px;
            background: white; display: flex; align-items: center;
            padding: 0 15px; gap: 10px; overflow-x: auto;
            white-space: nowrap; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .bubble {
            padding: 8px 20px; border-radius: 25px; background: #eee;
            color: #555; font-weight: bold; font-size: 13px; cursor: pointer;
        }

        .bubble.active { background: var(--purple); color: white; }

        /* --- OYUN KARTLARI --- */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 20px; }
        .game-card { 
            background: white; border-radius: 20px; min-height: 180px; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center; padding: 15px; text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .game-title { font-size: 12px; font-weight: bold; margin-top: 10px; word-break: break-all; }
    </style>
</head>
<body onload="initLauncher()">
    <header><div style="color:white; font-weight:800;">EDMOR LAUNCHER</div></header>
    
    <div class="bubble-container" id="category-bar">
        <div class="bubble active" onclick="filterGames('All')">Hepsi</div>
    </div>

    <main><div class="game-grid" id="container"></div></main>

    <script>
        let allGames = [];

        function initLauncher() {
            if (window.AndroidBridge) {
                const json = window.AndroidBridge.getGamesJson();
                allGames = JSON.parse(json);
                createCategories();
                renderGames('All');
            }
        }

        function createCategories() {
            const bar = document.getElementById('category-bar');
            const platforms = [...new Set(allGames.map(g => g.platform))];
            
            platforms.forEach(p => {
                const b = document.createElement('div');
                b.className = 'bubble';
                b.innerText = p;
                b.onclick = (e) => {
                    document.querySelectorAll('.bubble').forEach(el => el.classList.remove('active'));
                    b.classList.add('active');
                    renderGames(p);
                };
                bar.appendChild(b);
            });
        }

        function renderGames(filter) {
            const container = document.getElementById('container');
            container.innerHTML = '';
            
            const filtered = filter === 'All' ? allGames : allGames.filter(g => g.platform === filter);

            filtered.forEach(game => {
                const isInstalled = window.AndroidBridge.isPackageInstalled(game.package);
                const card = document.createElement('div');
                card.className = 'game-card';
                card.style.opacity = isInstalled ? "1" : "0.5";
                card.onclick = () => window.AndroidBridge.launchEmulator(game.package, game.path);
                
                card.innerHTML = `
                    <div style="font-size:10px; color:var(--purple); font-weight:bold;">${game.platform}</div>
                    <div class="game-title">${game.title}</div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
